<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>门店任务 · MealKey</title>
  <style>
    :root { --bg:#111318; --panel:#1a1d24; --line:#2a2f3a; --text:#e8eaef; --muted:#9aa3b2; --accent:#c9a227; --ok:#3d9a6a; --bad:#c45c4a; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 "PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:640px; margin:0 auto; padding:24px 16px 64px; }
    h1 { font-size:22px; margin:0 0 8px; }
    p { color:var(--muted); }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin:12px 0; }
    .card.overdue { border-color:var(--bad); }
    .card h2 { margin:0 0 8px; font-size:16px; }
    textarea, input { width:100%; background:#111; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; margin:8px 0; }
    button { border:0; border-radius:8px; padding:10px 14px; margin-right:8px; cursor:pointer; }
    .primary { background:var(--accent); color:#111; font-weight:650; }
    .ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
    .ok { color:var(--ok); }
    .bad { color:var(--bad); }
    .hint { font-size:12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>今天门店要做的事</h1>
    <p id="lead">加载中…</p>
    <div id="list"></div>
  </div>
  <script>
    const token = new URLSearchParams(location.search).get("t") || "";
    const lead = document.getElementById("lead");
    const list = document.getElementById("list");

    async function load() {
      if (!token) {
        lead.textContent = "缺少任务页令牌。请让老板在设置里生成门店任务页。";
        return;
      }
      const res = await fetch("/public/store-tasks/" + encodeURIComponent(token));
      const data = await res.json();
      if (!res.ok) {
        lead.textContent = data.detail || "打不开任务页";
        return;
      }
      lead.textContent = (data.manager_name || "店长") + " · 没有证据不能算做完";
      if (!data.tasks.length) {
        list.innerHTML = '<div class="card">现在没有待做的线下整改。</div>';
        return;
      }
      list.innerHTML = data.tasks.map((task) => `
        <article class="card ${task.overdue ? "overdue" : ""}" data-id="${task.id}">
          <h2>${escapeHtml(task.title)}</h2>
          <p>${escapeHtml(task.judgment || task.finding || "")}</p>
          <p class="hint">${task.overdue ? '<span class="bad">已超时</span> · ' : ""}${escapeHtml(task.evidence_needed || "")} · 已交 ${task.evidence_count} 份证据</p>
          <textarea placeholder="写下做了什么，例如：午班已补牛肉、打包改用防漏袋"></textarea>
          <input type="file" accept="image/*" />
          <div>
            <button class="ghost" data-ev>先交证据</button>
            <button class="primary" data-done ${task.has_evidence ? "" : "disabled"}>门店已做完</button>
          </div>
        </article>
      `).join("");
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (ch) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch]));
    }

    async function fileToDataUrl(file) {
      if (!file) return "";
      return await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    list.addEventListener("click", async (event) => {
      const card = event.target.closest(".card");
      if (!card) return;
      const loopId = card.dataset.id;
      const note = card.querySelector("textarea")?.value || "";
      const file = card.querySelector("input[type=file]")?.files?.[0];
      if (event.target.matches("[data-ev]")) {
        const data_url = await fileToDataUrl(file);
        const res = await fetch(`/public/store-tasks/${encodeURIComponent(token)}/${encodeURIComponent(loopId)}/evidence`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kind: data_url ? "photo" : "note", note, data_url }),
        });
        const data = await res.json();
        if (!res.ok) { alert(data.detail || "没能记下证据"); return; }
        await load();
      }
      if (event.target.matches("[data-done]")) {
        const res = await fetch(`/public/store-tasks/${encodeURIComponent(token)}/${encodeURIComponent(loopId)}/done`, { method: "POST" });
        const data = await res.json();
        if (!res.ok) { alert(data.detail || "没有证据不能算做完"); return; }
        await load();
      }
    });

    load().catch(() => { lead.textContent = "加载失败"; });
  </script>
</body>
</html>
