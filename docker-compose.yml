services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: sqlite:////data/mealky.db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - mealky-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/public/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # P0-3: Celery Worker — Daily Operating Clock + 归因 + 采集
  worker:
    build: .
    command: ["python", "-m", "celery", "-A", "app.jobs.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: sqlite:////data/mealky.db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - mealky-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # P0-3: Celery Beat — 定时调度（Daily Operating Clock 6 时段 + 归因 + 采集）
  beat:
    build: .
    command: ["python", "-m", "celery", "-A", "app.jobs.celery_app.celery_app", "beat", "--loglevel=INFO"]
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: sqlite:////data/mealky.db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - mealky-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Redis — Celery broker + result backend（内部依赖，不对外暴露端口）
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  mealky-data:
  redis-data:
