services:
  postgres:
    image: postgres:16-alpine
    container_name: mealkey-postgres
    env_file:
      - .env.seed
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mealky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-mealky}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mealky} -d ${POSTGRES_DB:-mealky}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mealkey-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  migrate:
    build:
      context: ../app/mealky-ai-backend
      dockerfile: Dockerfile
    container_name: mealkey-migrate
    command: ["python", "scripts/run_migrations.py"]
    env_file:
      - .env.seed
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../app/mealky-ai-backend
      dockerfile: Dockerfile
    container_name: mealkey-api
    env_file:
      - .env.seed
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      RUN_MIGRATIONS_ON_START: "0"
      MEALKEY_DISABLE_CLOCK: "1"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../data/uploads:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/public/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ../app/mealky-ai-backend
      dockerfile: Dockerfile
    container_name: mealkey-worker
    command: ["python", "-m", "celery", "-A", "app.jobs.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file:
      - .env.seed
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      RUN_MIGRATIONS_ON_START: "0"
      MEALKEY_DISABLE_CLOCK: "1"
    volumes:
      - ../data/uploads:/data
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: ../app/mealky-ai-backend
      dockerfile: Dockerfile
    container_name: mealkey-scheduler
    command: ["python", "-m", "celery", "-A", "app.jobs.celery_app.celery_app", "beat", "--loglevel=INFO"]
    env_file:
      - .env.seed
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      RUN_MIGRATIONS_ON_START: "0"
      MEALKEY_DISABLE_CLOCK: "1"
    volumes:
      - ../data/uploads:/data
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: mealkey-nginx
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
