name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Syntax
        run: python -m compileall -q app scripts
      - name: Pytest
        env:
          MEALKEY_DISABLE_CLOCK: "1"
          MEALKY_AGENT_LLM: "0"
          MEALKY_DIAGNOSIS_LLM: "0"
        run: python -m pytest -q --tb=short

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mealky-api:ci .
