services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mealky
      POSTGRES_PASSWORD: mealky
      POSTGRES_DB: mealky
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealky -d mealky"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      # 生产默认 Postgres，避免多进程 SQLite 写冲突；本地可覆盖回 sqlite
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mealky:mealky@db:5432/mealky}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CORS_ORIGINS: ${CORS_ORIGINS:-https://mealkey.cn,https://www.mealkey.cn,http://localhost:8000,http://127.0.0.1:8000}
      MEALKEY_DISABLE_CLOCK: "1"
      RUN_SCHEMA_SYNC_ON_STARTUP: "0"
      RUN_MIGRATIONS_ON_START: "0"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - mealky-data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/public/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # 一次性 migration，完成后 api 才启动
  migrate:
    build: .
    command: ["python", "scripts/run_migrations.py"]
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mealky:mealky@db:5432/mealky}
    volumes:
      - mealky-data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # Celery Worker — Daily Operating Clock + 归因 + 采集
  worker:
    build: .
    command: ["python", "-m", "celery", "-A", "app.jobs.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mealky:mealky@db:5432/mealky}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MEALKEY_DISABLE_CLOCK: "1"
      RUN_MIGRATIONS_ON_START: "0"
    volumes:
      - mealky-data:/data
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Beat — 定时调度
  beat:
    build: .
    command: ["python", "-m", "celery", "-A", "app.jobs.celery_app.celery_app", "beat", "--loglevel=INFO"]
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mealky:mealky@db:5432/mealky}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MEALKEY_DISABLE_CLOCK: "1"
      RUN_MIGRATIONS_ON_START: "0"
    volumes:
      - mealky-data:/data
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  mealky-data:
  redis-data:
  postgres-data:

# 备份：在宿主机执行
#   BACKUP_DIR=./backups DATABASE_URL=postgresql://mealky:mealky@127.0.0.1:5432/mealky python scripts/backup_postgres.py
# HTTPS 由前置反向代理终止；密钥只放 .env，不要写入数据库。
