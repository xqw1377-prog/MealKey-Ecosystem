<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MealKey 手机预览</title>
    <style>
      :root {
        --desk: #e8e4dc;
        --ink: #1a1a1a;
        --muted: #7a746c;
        --frame: #1c1b1a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(1200px 600px at 20% -10%, #fff8ef 0%, transparent 55%),
          radial-gradient(900px 500px at 90% 10%, #efe8dc 0%, transparent 50%),
          var(--desk);
        color: var(--ink);
      }
      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 20px 48px;
        display: grid;
        grid-template-columns: minmax(240px, 320px) 1fr;
        gap: 32px;
        align-items: start;
      }
      @media (max-width: 900px) {
        .page { grid-template-columns: 1fr; }
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: -0.03em;
      }
      .lead {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.55;
        font-size: 14px;
      }
      .tips {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 10px;
      }
      .tips li {
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(26, 26, 26, 0.06);
        font-size: 13px;
        line-height: 1.5;
      }
      .tips strong { display: block; margin-bottom: 2px; }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 18px 0 8px;
      }
      .actions a, .actions button {
        appearance: none;
        border: 1px solid rgba(26, 26, 26, 0.12);
        background: #fff;
        color: var(--ink);
        border-radius: 999px;
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .actions a.primary, .actions button.primary {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      .stage {
        display: flex;
        justify-content: center;
        padding-top: 8px;
      }
      .phone {
        width: 390px;
        max-width: 100%;
        background: var(--frame);
        border-radius: 42px;
        padding: 12px;
        box-shadow:
          0 30px 80px rgba(26, 26, 26, 0.28),
          inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        position: relative;
      }
      /* 状态栏到摄像头下沿；网页紧贴其下（+1px 防叠字） */
      .phone-screen {
        --phone-island-top: 11px;
        --phone-island-h: 28px;
        --phone-status-h: calc(var(--phone-island-top) + var(--phone-island-h) + 1px);
        background: #f7f5f0;
        border-radius: 32px;
        overflow: hidden;
        height: 780px;
        max-height: min(780px, calc(100vh - 80px));
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .phone-status {
        position: relative;
        flex: 0 0 var(--phone-status-h);
        background: #f7f5f0;
      }
      .phone-status::after {
        content: "";
        position: absolute;
        top: var(--phone-island-top);
        left: 50%;
        transform: translateX(-50%);
        width: 108px;
        height: var(--phone-island-h);
        background: #0d0d0d;
        border-radius: 20px;
      }
      .phone-screen iframe {
        flex: 1 1 auto;
        width: 100%;
        height: auto;
        min-height: 0;
        border: 0;
        background: #f4f2ec;
        /* 预览框内也不露出浏览器默认滚动条 */
        scrollbar-width: none;
      }
      .hint {
        margin-top: 14px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <aside>
        <h1>MealKey 手机预览</h1>
        <p class="lead">
          右侧是 iPhone 尺寸画框（390×780），直接嵌套真实首页。
          用底部「线程 / 今天 / 日记」切换，感受老板在手机上的主路径。
        </p>
        <div class="actions">
          <a class="primary" href="/" target="_blank" rel="noopener">打开完整站</a>
          <button type="button" id="reloadBtn">刷新手机内页</button>
          <button type="button" id="sizeBtn">切换 390 / 360</button>
        </div>
        <ul class="tips">
          <li>
            <strong>今天（默认）</strong>
            中栏独占：AI 问题 + 选项 + 底部命令条，不堆三栏。
          </li>
          <li>
            <strong>线程</strong>
            左侧工作线程以抽屉滑出，点遮罩或再点 Tab 关闭。
          </li>
          <li>
            <strong>日记</strong>
            右侧经营流抽屉；命令条始终避开底栏与安全区。
          </li>
        </ul>
      </aside>
      <section class="stage">
        <div>
          <div class="phone" id="phoneFrame">
            <div class="phone-screen">
              <div class="phone-status" aria-hidden="true"></div>
              <iframe id="phoneFrameView" title="MealKey mobile" src="/?mobile_preview=1"></iframe>
            </div>
          </div>
          <p class="hint">刘海在状态栏内，不再遮挡顶栏。若主内容空白，多半是接口超时，不是没起服务。</p>
        </div>
      </section>
    </div>
    <script>
      const frame = document.getElementById("phoneFrame");
      const view = document.getElementById("phoneFrameView");
      let wide = true;
      document.getElementById("reloadBtn").onclick = () => {
        view.src = view.src;
      };
      document.getElementById("sizeBtn").onclick = () => {
        wide = !wide;
        frame.style.width = wide ? "390px" : "360px";
      };
    </script>
  </body>
</html>
